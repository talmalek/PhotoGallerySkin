name: Sync Google Album

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (add or remove)'
        required: true
        default: 'add'
        type: choice
        options:
          - add
          - remove
      target:
        description: 'Google Photos share URL (for add) or shareUrl / album ID (for remove)'
        required: true
        type: string
  repository_dispatch:
    types: [sync-google-album]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Album Manager
        run: |
          ACTION="${{ github.event.inputs.action || github.event.client_payload.action }}"
          TARGET="${{ github.event.inputs.target || github.event.client_payload.target }}"
          echo "Executing album manager action: $ACTION for target: $TARGET"
          node scripts/manage-google-albums.mjs "$ACTION" "$TARGET"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/config/googleAlbums.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(google-albums): sync albums via GitHub Action [skip ci]"
            git push origin main
          fi

      - name: Build project
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
